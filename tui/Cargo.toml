[package]
name = "graphdb-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "graphdb-tui"
path = "src/main.rs"

[features]
default = []
cuda = ["model-hub/cuda"]
rocm = ["model-hub/rocm"]
metal = ["model-hub/metal"]
